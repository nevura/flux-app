name: FluxApp
options:
  bundleIdPrefix: com.nevura
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  FluxApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FluxApp
    info:
      path: FluxApp/Info.plist
      properties:
        CFBundleDisplayName: Flux
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Automatic
    entitlements:
      path: FluxApp/FluxApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nevura.flux
    dependencies:
      - package: Supabase
        product: Supabase
    postBuildScripts:
      - name: "App Intents Metadata Processor"
        shell: /bin/bash
        script: |
          set -e
          ARCH="${CURRENT_ARCH:-${ARCHS%% *}}"
          OBJ="${OBJECT_FILE_DIR_normal}/${ARCH}"

          SRC_LIST="${DERIVED_FILE_DIR}/FluxIntentSources.txt"
          find "${SRCROOT}/FluxApp" -name "*.swift" > "${SRC_LIST}"

          CONST_LIST="${DERIVED_FILE_DIR}/FluxIntentConstVals.txt"
          find "${OBJ}" -name "*.swiftconstvalues" 2>/dev/null > "${CONST_LIST}"

          if [[ "${EFFECTIVE_PLATFORM_NAME}" == *simulator* ]]; then
              TRIPLE="${ARCH}-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}-simulator"
          else
              TRIPLE="${ARCH}-apple-ios${IPHONEOS_DEPLOYMENT_TARGET}"
          fi

          META="${DERIVED_FILE_DIR}/${PRODUCT_NAME}.DependencyMetadataFileList"
          SMETA="${DERIVED_FILE_DIR}/${PRODUCT_NAME}.DependencyStaticMetadataFileList"
          SDATA="${OBJ}/ExtractedAppShortcutsMetadata.stringsdata"

          ARGS=(
              --output "${CODESIGNING_FOLDER_PATH}/Metadata.appintents"
              --toolchain-dir "${DT_TOOLCHAIN_DIR}"
              --module-name "${PRODUCT_MODULE_NAME}"
              --sdk-root "${SDKROOT}"
              --xcode-version "${XCODE_PRODUCT_BUILD_VERSION}"
              --platform-family "IOS"
              --deployment-target "${IPHONEOS_DEPLOYMENT_TARGET}"
              --target-triple "${TRIPLE}"
              --source-file-list "${SRC_LIST}"
              --swift-const-vals-list "${CONST_LIST}"
              --no-app-shortcuts-localization
          )
          [ -f "${META}" ]  && ARGS+=(--metadata-file-list "${META}")
          [ -f "${SMETA}" ] && ARGS+=(--static-metadata-file-list "${SMETA}")
          [ -f "${SDATA}" ] && ARGS+=(--stringsdata-file "${SDATA}")

          xcrun appintentsmetadataprocessor "${ARGS[@]}"
        outputFiles:
          - ${CODESIGNING_FOLDER_PATH}/Metadata.appintents

    settings:
      base:
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.nevura.fluxapp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
